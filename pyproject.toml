[project]
name = "pybbtd"
version = "0.1.0"
description = "Block term tensor decompositions (BTD, Cov-LL1, Stokes, BBTD) for imaging data."
readme = "README.md"
authors = [
    { name = "scbarreto", email = "sbarreto.cardoso@gmail.com" },
    { name = "jflamant", email = "flamantjf@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "palettable>=3.0.1",
    "scikit-learn>=1.2",
    "scipy>=1.13.1",
    "tensorly>=0.9.0",
]

[project.urls]
Documentation = "https://scbarreto.github.io/pyBBTD/"
Source = "https://github.com/scbarreto/pyBBTD"

[project.optional-dependencies]
docs = [
    "sphinx>=8.2.0",
    "sphinx-book-theme>=1.1",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "myst-nb>=1.2",
]
notebooks = [
    "ipykernel>=6.29.5",
    "nbclient>=0.10",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0",
    "ruff>=0.11.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # modern Python syntax
    "N",   # PEP 8 naming
    "NPY", # NumPy-specific rules
]
ignore = [
    "E501", # long lines are left to the formatter
    "N803", # matrices and tensors use capital letters (A, B, T, ...)
    "N806",
    "NPY002", # random draws use NumPy's global RNG, so np.random.seed() reproduces runs
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"] # notebooks import where the narrative needs it
"tests/*" = ["N802"] # test names refer to math symbols (LL1, R, L1, ...)

[tool.ruff.lint.isort]
known-first-party = ["pybbtd"]

[tool.ruff.format]
docstring-code-format = true
